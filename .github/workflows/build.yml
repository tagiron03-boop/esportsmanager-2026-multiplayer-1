name: Build Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore ESM26.DualManager.csproj

      - name: Build
        run: dotnet build ESM26.DualManager.csproj -c Release -o build

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: ESM26.DualManager
          path: build/ESM26.DualManager.dll
          if-no-files-found: error
